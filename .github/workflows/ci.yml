name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # BEFORE setup-node
      - uses: actions/setup-node@v4 # v4, NOT v5 — v5 auto-caches when
        with: # packageManager is present and collides
          node-version: 24 # with pnpm/action-setup's own caching
          cache: pnpm
      # Always pnpm, never npm's clean-install: it is a documented, repeated failure
      # against a Windows-authored lockfile.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      # `tsc --noEmit` is not `next build`. The build additionally validates route-segment
      # exports and PageProps/searchParams against generated .next/types, resolves the
      # server/client boundary (the "a 'use client' module's exports are client REFERENCES
      # in a server component" class of bug this repo documents twice), and EVALUATES
      # src/env.ts at collect time — verified here: an unparseable runtime pool URL fails
      # `next build` with "Failed to collect page data for /" while typecheck stays green.
      # .vercelignore already records a build that compiled fine and then failed on Vercel;
      # this is the step that would have caught it.
      #
      # Placeholders, not secrets: this job runs on pull_request, and a build needs no real
      # credential. src/env.ts requires CLERK_SECRET_KEY to be non-empty and a runtime pool
      # URL that parses; postgres() does not connect at construction, so that URL is never
      # dialled, and the publishable key only has to be well-formed. RUNTIME_DB_URL is
      # src/env.ts's vendor-neutral alias — see the note on the db job below.
      # Verified locally: `next build` succeeds on exactly these three values.
      - run: pnpm build
        env:
          CLERK_SECRET_KEY: sk_test_placeholder_for_build_only
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
          RUNTIME_DB_URL: postgres://app_user:x@localhost:5432/unused

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siteless_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/siteless_test
      # The NON-OWNER runtime role. Without it tests/db/with-org.test.ts fell back to the
      # owner above, and as the superuser `set local role authenticated` always succeeds —
      # so `grant authenticated to app_user` (drizzle/0000_bootstrap.sql) was proven only on
      # a developer machine whose local env happened to carry this URL. Deleting that line
      # left CI green and every production request returning 42501.
      # `pnpm db:migrate` runs before `pnpm test:db` and is what sets this password
      # (scripts/db.ts, localhost targets only), so the order below already works.
      # Deliberately NOT named after the production vendor: T-1-19 asserts this file is
      # greppable-clean of it. This URL reaches the service container and nothing else.
      RUNTIME_DB_URL: postgres://app_user:app_user@localhost:5432/siteless_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:db

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A gate that quietly SKIPS when it cannot run is how the pre-CI state came about.
      # This fails loudly and names the missing variable; it never prints a value.
      - name: Check that the repository secrets are configured
        run: |
          missing=""
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — the e2e gate cannot run"
            exit 1
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Both paths. `playwright-report/` alone did not exist — the `list` reporter writes
      # nothing to disk — so this step logged "No files were found" and every failed e2e run
      # discarded the traces that would show why. `test-results/` is where
      # `trace: 'retain-on-failure'` puts them (playwright's default outputDir).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
